<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House | Landing page</title>

    <!-- Font Awesome cdn -->
    <script
      src="https://kit.fontawesome.com/16daa4f40d.js"
      crossorigin="anonymous"
    ></script>

    <!-- Google font cdn -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <!-- TailwindCSS cdn -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              clifford: "#da373d",
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <!-- Header section start from here -->
    <header class="max-w-screen-xl px-16 lg:px-20 mx-auto py-8 md:py-10 lg:py-16">
      <!-- Banner start from here -->
      <section class="md:flex">
        <!-- Banner content -->
        <div class="basis-1/2">
          <h1 class="text-5xl md:text-7xl font-extrabold text-">
            It's good <br />
            tea time at The <br />
            Tea House
          </h1>
          <p class="text-gray-500 w-3/4 my-8">
            Tea and Botanical Solutions Supplier Give Optimum Satisfaction To
            Your Taste Buds.
          </p>
          <button class="flex items-center bg-gradient-to-r from-orange-500 to-red-500 px-5 py-4 rounded-lg text-white font-bold text-xl gap-3">
            <span>Explore More</span
            ><i class="-rotate-45 fa-solid fa-arrow-right-long"></i>
          </button>
        </div>
        <!-- Banner image -->
        <div class="relative basis-1/2">
          <figure>
            <img class="w-full" src="./images/banner.png" alt="" />
          </figure>
          <!-- Rating tag -->
          <div class="flex items-center bg-white py-2 px-2 md:px-10 lg:py-4 shadow-lg rounded-xl gap-3 absolute top-20 md:top-80 md:left-32 lg:left-28">
            <i class="fa-solid fa-star text-2xl text-amber-300"></i>
            <div>
              <h4 class="lg:text-2xl font-bold">5.00</h4>
              <p class="text-gray-500">Trust Pilot Ratings</p>
            </div>
          </div>
        </div>
      </section>
      <!-- Banner end here -->
    </header>
    <!-- Header section end here -->

    <!-- Main section start from here -->
    <main></main>
    <!-- Main section end here -->

    <!-- Footer section start from here -->
    <footer></footer>
    <!-- Footer section end here -->
  </body>
</html>
