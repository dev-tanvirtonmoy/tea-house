<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House | Landing page</title>

    <!-- Font Awesome cdn -->
    <script
      src="https://kit.fontawesome.com/16daa4f40d.js"
      crossorigin="anonymous"
    ></script>

    <!-- Google font cdn -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <!-- TailwindCSS cdn -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              clifford: "#da373d",
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <!-- Header section start from here -->
    <header class="container mx-auto">
      <!-- Banner start from here -->
      <section class="px-4 md:flex border border-black">
        <!-- Banner content -->
        <div>
          <h1>It's good tea time at The Tea House</h1>
          <p>
            Tea and Botanical Solutions Supplier Give Optimum Satisfaction To
            Your Taste Buds.
          </p>
          <button>
            <span>Explore More</span
            ><i class="fa-solid fa-arrow-right-long"></i>
          </button>
        </div>
        <!-- Banner image -->
        <div>
          <figure>
            <img src="./images/banner.png" alt="" />
          </figure>
          <!-- Rating tag -->
          <div class="flex items-center">
            <i class="fa-solid fa-star"></i>
            <div>
                <h4>5.00</h4>
                <p>Trust Pilot Ratings</p>
            </div>
          </div>
        </div>
      </section>
      <!-- Banner end here -->
    </header>
    <!-- Header section end here -->

    <!-- Main section start from here -->
    <main></main>
    <!-- Main section end here -->

    <!-- Footer section start from here -->
    <footer></footer>
    <!-- Footer section end here -->
  </body>
</html>
